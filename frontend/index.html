<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#D2691E" />
    <meta
      name="description"
      content="PamploHogar conecta estudiantes de la Universidad de Pamplona con habitaciones, apartaestudios y apartamentos, sin cobros abusivos ni voz a voz."
    />
    <!--
      Lo que se ve cuando alguien manda el enlace por WhatsApp, Facebook o X.
      Sin esto el mensaje sale como una linea de texto pelada, y ese enlace
      compartido entre estudiantes es la publicidad que mas circula.

      La direccion de la imagen tiene que ser completa, con https y dominio:
      WhatsApp no resuelve rutas que empiecen por barra.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PamploHogar" />
    <meta property="og:locale" content="es_CO" />
    <meta property="og:url" content="https://pamplohogar.com/" />
    <meta property="og:title" content="PamploHogar | Vivienda para estudiantes en Pamplona" />
    <meta
      property="og:description"
      content="Habitaciones, apartaestudios y apartamentos en Pamplona: la distancia real hasta la universidad, si el precio se sale de lo normal del barrio y lo que cuentan los que ya vivieron ahí."
    />
    <meta property="og:image" content="https://pamplohogar.com/compartir.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Una ventana abierta sobre los tejados y las montañas de Pamplona, con el nombre PamploHogar."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="/marca-icono.png" />
    <!-- El iPhone no entiende iconos SVG: si se le deja el de la marca, al
         agregar la pagina a la pantalla de inicio inventa una miniatura. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icono-apple-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="PamploHogar" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Solo los pesos que se usan de verdad. Cada peso extra es otra descarga
         antes de que aparezca el primer texto. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <title>PamploHogar | Vivienda para estudiantes en Pamplona</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
